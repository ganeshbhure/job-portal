services:
  dbservice:
    image: postgres:latest
    container_name: jobportaldb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
      POSTGRES_DB: jobportal
    volumes:
      - jobportal-data:/var/lib/postgresql

  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  jobportal-data:
